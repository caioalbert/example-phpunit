services:
  tests:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TEST_NAME: Scarlett
      XDEBUG_MODE: coverage
    command:
      - sh
      - -lc
      - composer install --no-interaction --prefer-dist --no-progress && composer test:coverage
